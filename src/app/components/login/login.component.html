<div class="login-container">
  <div class="card shadow split-card">
    <div class="row g-0">
      
      <!-- PARTE IZQUIERDA: Banner con foto de Biblioteca -->
      <div class="col-md-6 left-banner text-center d-none d-md-flex">
        <i class="bi bi-book-half mb-3 text-primary" style="font-size: 4.5rem;"></i>
        <h3 class="fw-bold m-0">Biblioteca Escolar</h3>
        <p class="text-white-50 small mt-2 px-4">
          Panel administrativo para la gestión de préstamos, inventario y registros de usuarios.
        </p>
      </div>

      <div class="col-md-6 p-4 p-sm-5 bg-white">
        <h3 class="fw-bold mb-1 text-dark">Iniciar Sesión</h3>
        <p class="text-muted small mb-4">Ingresa tus datos para acceder al sistema</p>

        <form (ngSubmit)="iniciarSesion()">
          
          <!-- Input de Usuario (Limitado a 20 caracteres) -->
          <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Nombre de Usuario</label>
            <input 
              type="text" 
              name="usuario" 
              [(ngModel)]="usuario" 
              class="form-control py-2" 
              placeholder="Ej: admin" 
              maxlength="20"
              required>
          </div>

          <!-- Input de Contraseña (Limitado a 16 caracteres) -->
          <div class="mb-4">
            <label class="form-label small fw-semibold text-secondary">Contraseña</label>
            <input 
              type="password" 
              name="contrasena" 
              [(ngModel)]="contrasena" 
              class="form-control py-2" 
              placeholder="••••••••" 
              maxlength="16"
              required>
          </div>

          <!-- Botón de Entrada -->
          <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm">
            Ingresar al Sistema
          </button>

        </form>
      </div>

    </div>
  </div>
</div>
